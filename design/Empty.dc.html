<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D9B45B; } a:hover { color: #E8C87A; }
  </style>
</helmet>

<div style="width: 390px; min-height: 620px; background: #0E0E10; color: #F2F2F3; font-family: -apple-system, 'SF Pro Display', 'Manrope', system-ui, sans-serif; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: baseline; gap: 10px; padding: 2px 4px 0;">
    <div style="font-weight: 800; font-size: 18.4px; letter-spacing: -0.02em;">Тратомер</div>
    <div style="margin-left: auto; color: #8A8A90; font-size: 13.1px;">Август 2026</div>
  </div>

  <div style="background: #151517; border: 1px solid #26262A; border-radius: 20px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <svg width="64" height="64" viewBox="0 0 46 46" style="flex: 0 0 auto;">
      <path d="M7 28C7 16 14 8 23 8s16 8 16 20c0 6-7 10-16 10S7 34 7 28z" fill="#D9B45B"></path>
      <circle cx="17.5" cy="25" r="3" fill="#0E0E10"></circle>
      <circle cx="28.5" cy="25" r="3" fill="#0E0E10"></circle>
      <path d="M17 32c3 2.6 9 2.6 12 0" stroke="#0E0E10" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
    </svg>
    <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.02em;">Месяц чистый</div>
    <div style="color: #8A8A90; font-size: 14.1px; line-height: 1.5; max-width: 30ch;">Запишите первую трату — и я посчитаю, сколько можно тратить в день, чтобы уложиться в 30 000 ₽.</div>
  </div>

  <div style="background: #151517; border: 1px solid #26262A; border-radius: 20px; padding: 16px;">
    <div style="font-weight: 500; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8A90;">Первая трата</div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 10px;">
      <div style="aspect-ratio: 1; border-radius: 50%; background: #F4A340; display: grid; place-items: center; border: 2px solid #F2F2F3;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"></path><path d="M4 11a8 8 0 0 0 16 0"></path><path d="M2 19h20"></path></svg>
      </div>
      <div style="aspect-ratio: 1; border-radius: 50%; background: #4A90D9; display: grid; place-items: center; opacity: 0.55;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M6 10h12"></path><path d="M8 21l2-3M16 21l-2-3"></path></svg>
      </div>
      <div style="aspect-ratio: 1; border-radius: 50%; background: #9B6BD6; display: grid; place-items: center; opacity: 0.55;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"></path><path d="M6 10v9h12v-9"></path></svg>
      </div>
      <div style="aspect-ratio: 1; border-radius: 50%; background: #57C2C2; display: grid; place-items: center; opacity: 0.55;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-45 12 12)"></rect><path d="M9 9l6 6"></path></svg>
      </div>
      <div style="aspect-ratio: 1; border-radius: 50%; background: #E4577E; display: grid; place-items: center; opacity: 0.55;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18M8 6v4M16 6v4"></path></svg>
      </div>
      <div style="aspect-ratio: 1; border-radius: 50%; background: #8BC34A; display: grid; place-items: center; opacity: 0.55;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      </div>
    </div>
    <div style="text-align: center; color: #8A8A90; font-size: 12.8px; margin-top: 8px;">Еда</div>

    <div style="text-align: center; font-weight: 800; font-size: 41.6px; letter-spacing: -0.02em; padding: 6px 0; font-variant-numeric: tabular-nums; color: #8A8A90;">0 ₽</div>

    <div style="position: relative; height: 46px; border-radius: 999px; background: #0E0E10; border: 1px solid #26262A; overflow: hidden;">
      <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #8A8A90 0 1px, transparent 1px 14px); opacity: 0.5;"></div>
      <div style="position: absolute; left: 50%; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: #D9B45B;"></div>
    </div>

    <div style="background: #0E0E10; color: #D9B45B; border: 1px solid #D9B45B; border-radius: 999px; padding: 14px; font-weight: 800; font-size: 16px; text-align: center; margin-top: 12px;">Записать</div>
  </div>

</div>
</x-dc>
</body>
</html>
